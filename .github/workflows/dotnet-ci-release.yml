name: dotnet-ci-release

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ "8.0.x", "9.0.x", "10.0.x" ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore ResizingClient
        run: dotnet restore source/ResizingClient/ResizingClient.csproj
      - name: Build ResizingClient
        run: dotnet build source/ResizingClient/ResizingClient.csproj -c Release --no-restore

  pack:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore source/ResizingClient/ResizingClient.csproj
      - name: Pack
        run: dotnet pack source/ResizingClient/ResizingClient.csproj -c Release --no-restore -o artifacts /p:PackageVersion=${GITHUB_REF_NAME#v}
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
      - name: Publish to NuGet
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
