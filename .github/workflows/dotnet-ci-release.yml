name: dotnet-ci-release

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ "8.0.x", "9.0.x", "10.0.x" ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore ResizingClient
        run: dotnet restore source/ResizingClient/ResizingClient.csproj
      - name: Build ResizingClient
        run: dotnet build source/ResizingClient/ResizingClient.csproj -c Release --no-restore
      - name: Restore ResizingClient.Tests
        run: dotnet restore source/ResizingClient.Tests/ResizingClient.Tests.csproj
      - name: Test ResizingClient.Tests
        run: dotnet test source/ResizingClient.Tests/ResizingClient.Tests.csproj -c Release --no-restore

  build-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore ResizingServer solution
        run: nuget restore source/ResizingServer.sln
      - name: Build ResizingServer
        run: msbuild source/ResizingServer/ResizingServer.csproj /p:Configuration=Release /p:Platform=AnyCPU

  pack:
    runs-on: ubuntu-latest
    needs:
      - build
      - build-server
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore source/ResizingClient/ResizingClient.csproj
      - name: Pack
        run: dotnet pack source/ResizingClient/ResizingClient.csproj -c Release --no-restore -o artifacts /p:PackageVersion=${GITHUB_REF_NAME#v}
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
      - name: Publish to NuGet
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
